<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1280" role="img" aria-label="Linograbado: un brazo enorme del Estado empuja una fila de cuerpos jóvenes idénticos que caen por el borde hacia un campo rojo.">
  <defs>
    <filter id="lino-c" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.045" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
    </filter>
    <filter id="lino-c2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022 0.05" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="15"/>
    </filter>
    <g id="cuerpo">
      <circle cx="0" cy="0" r="22"/>
      <path d="M-18,28 C-18,18 18,18 18,28 L26,150 L-26,150 Z"/>
    </g>
  </defs>

  <!-- Campo rojo donde caen (segunda tinta, desregistrada) -->
  <g fill="#cc2f26" filter="url(#lino-c2)" transform="translate(-7 7)">
    <polygon points="0,820 470,980 360,1280 0,1280"/>
  </g>

  <g fill="#211c16" filter="url(#lino-c)">
    <!-- campo rojo borde tallado encima del rojo -->
    <g fill="#cc2f26">
      <polygon points="0,830 460,985 350,1280 0,1280"/>
    </g>

    <!-- plataforma / borde -->
    <polygon points="0,770 700,770 700,840 470,980 0,900"/>

    <!-- fila de cuerpos idénticos esperando -->
    <use href="#cuerpo" transform="translate(660 612)"/>
    <use href="#cuerpo" transform="translate(596 618)"/>
    <use href="#cuerpo" transform="translate(536 624)"/>
    <use href="#cuerpo" transform="translate(478 630)"/>
    <!-- los de adelante ya se inclinan y caen -->
    <use href="#cuerpo" transform="translate(410 650) rotate(-22)"/>
    <use href="#cuerpo" transform="translate(330 700) rotate(-52)"/>
    <use href="#cuerpo" transform="translate(225 820) rotate(-92)"/>
    <use href="#cuerpo" transform="translate(120 940) rotate(-138)"/>

    <!-- brazo enorme del Estado empujando desde arriba a la derecha -->
    <path d="M1000,120 L1000,470 L770,610 C742,628 712,612 706,584 C700,556 716,536 742,520 L1000,120 Z"/>
    <!-- puño -->
    <path d="M748,512 C700,520 666,556 668,598 C670,640 706,668 752,664 C812,658 858,640 880,604 C905,560 892,510 852,498 C812,486 786,500 748,512 Z"/>
    <g fill="#ece5d6">
      <path d="M712,556 C740,548 770,548 798,556" stroke="#ece5d6" stroke-width="7" fill="none"/>
      <path d="M708,592 C740,602 772,602 802,592" stroke="#ece5d6" stroke-width="7" fill="none"/>
    </g>

    <!-- gubias talladas en el campo de caída -->
    <g stroke="#ece5d6" stroke-width="7" fill="none" opacity="0.75">
      <path d="M30,1010 C160,1060 280,1110 360,1210"/>
      <path d="M30,1090 C140,1130 240,1180 300,1265"/>
    </g>
  </g>
</svg>
