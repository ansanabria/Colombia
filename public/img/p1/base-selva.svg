<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1280" role="img" aria-label="Linograbado: una base militar precaria de madera, diminuta, rodeada y aplastada por una selva negra inmensa, con una señal roja sobre la torre.">
  <defs>
    <filter id="lino-b" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.04" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16"/>
    </filter>
    <filter id="lino-b2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="2" seed="22" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
    </filter>
    <path id="fronda" d="M0,0 C70,-30 150,-26 210,18 C150,8 96,16 0,52 C70,18 60,8 0,0 Z"/>
  </defs>

  <!-- Señal roja (peligro) tras la torre, desregistrada -->
  <g fill="#cc2f26" filter="url(#lino-b2)" transform="translate(7 5)">
    <circle cx="500" cy="690" r="60"/>
    <rect x="492" y="560" width="16" height="150"/>
  </g>

  <g fill="#211c16" filter="url(#lino-b)">
    <!-- dosel superior que aplasta la escena -->
    <path d="M0,0 L1000,0 L1000,300 C880,250 820,330 720,300 C650,360 560,300 470,340 C400,300 300,360 220,310 C140,350 70,300 0,330 Z"/>
    <g>
      <use href="#fronda" transform="translate(70 250) scale(1.5) rotate(20)"/>
      <use href="#fronda" transform="translate(840 230) scale(-1.7 1.7) rotate(-15)"/>
      <use href="#fronda" transform="translate(120 470) scale(1.2) rotate(48)"/>
      <use href="#fronda" transform="translate(900 440) scale(-1.3 1.3) rotate(-50)"/>
      <use href="#fronda" transform="translate(40 760) scale(1.4) rotate(70)"/>
      <use href="#fronda" transform="translate(960 740) scale(-1.5 1.5) rotate(-72)"/>
    </g>

    <!-- base diminuta: choza sobre pilotes + torre de vigía -->
    <g>
      <!-- torre -->
      <polygon points="470,560 530,560 524,720 476,720"/>
      <rect x="458" y="540" width="84" height="34"/>
      <polygon points="452,540 548,540 500,500"/>
      <rect x="476" y="720" width="10" height="120"/>
      <rect x="514" y="720" width="10" height="120"/>
      <!-- choza -->
      <rect x="372" y="772" width="180" height="86"/>
      <polygon points="360,772 564,772 462,716"/>
      <rect x="384" y="858" width="9" height="70"/>
      <rect x="531" y="858" width="9" height="70"/>
      <rect x="456" y="858" width="9" height="70"/>
      <!-- dos centinelas minúsculos -->
      <g>
        <rect x="600" y="812" width="11" height="34"/>
        <circle cx="605.5" cy="804" r="7"/>
        <rect x="624" y="816" width="11" height="34"/>
        <circle cx="629.5" cy="808" r="7"/>
      </g>
    </g>

    <!-- suelo de selva + gubias talladas -->
    <path d="M0,940 C260,900 740,900 1000,944 L1000,1280 L0,1280 Z"/>
    <g stroke="#ece5d6" stroke-width="8" fill="none" opacity="0.8">
      <path d="M20,1010 C280,975 720,975 985,1012"/>
      <path d="M20,1080 C300,1040 700,1040 985,1085"/>
      <path d="M20,1160 C320,1120 680,1120 985,1165"/>
    </g>
  </g>
</svg>
