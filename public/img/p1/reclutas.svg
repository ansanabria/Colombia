<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1280" role="img" aria-label="Linograbado: una larga columna de jóvenes reclutas marcha hacia la reja de un cuartel mientras, aparte, una figura de saco entrega una libreta tras un escritorio.">
  <defs>
    <filter id="lino-a" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.05" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13"/>
    </filter>
    <filter id="lino-a2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.045" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13"/>
    </filter>
    <g id="recluta">
      <path d="M22,170 L20,150 L24,96 C24,84 30,78 38,76 L36,60 C30,57 27,50 27,42 C27,30 35,22 46,22 C57,22 65,30 65,42 C65,50 62,57 56,60 L54,76 C63,78 70,86 70,98 L74,150 L72,170 L52,170 L50,118 L46,170 Z"/>
      <path d="M26,40 L66,40 L71,28 C60,15 31,15 22,28 Z"/>
      <ellipse cx="80" cy="92" rx="15" ry="27" transform="rotate(13 80 92)"/>
    </g>
  </defs>

  <!-- Plancha roja (segunda tinta, desregistrada) -->
  <g fill="#cc2f26" filter="url(#lino-a2)" transform="translate(8 6)">
    <polygon points="690,150 690,250 560,205"/>
    <rect x="690" y="150" width="14" height="470"/>
    <rect x="120" y="1130" width="150" height="26"/>
  </g>

  <!-- Plancha de tinta -->
  <g fill="#211c16" filter="url(#lino-a)">
    <!-- suelo -->
    <path d="M0,1180 L1000,1110 L1000,1280 L0,1280 Z"/>
    <!-- cuartel + reja, arriba a la derecha -->
    <rect x="700" y="470" width="300" height="650"/>
    <path d="M690,470 L1000,470 L1000,410 L860,330 L690,470 Z"/>
    <g fill="#ece5d6">
      <rect x="726" y="540" width="16" height="560"/>
      <rect x="772" y="540" width="16" height="560"/>
      <rect x="818" y="540" width="16" height="560"/>
      <rect x="864" y="540" width="16" height="560"/>
      <rect x="910" y="540" width="16" height="560"/>
      <rect x="700" y="700" width="300" height="14"/>
    </g>
    <!-- asta + bandera -->
    <rect x="690" y="150" width="13" height="470"/>
    <polygon points="690,150 690,250 560,205"/>

    <!-- columna de reclutas, de grande (cerca) a pequeño (lejos) -->
    <use href="#recluta" transform="translate(40 980) scale(1.7)"/>
    <use href="#recluta" transform="translate(190 940) scale(1.45)"/>
    <use href="#recluta" transform="translate(310 905) scale(1.22)"/>
    <use href="#recluta" transform="translate(410 878) scale(1.02)"/>
    <use href="#recluta" transform="translate(492 858) scale(0.85)"/>
    <use href="#recluta" transform="translate(560 842) scale(0.7)"/>
    <use href="#recluta" transform="translate(616 830) scale(0.57)"/>
    <use href="#recluta" transform="translate(662 821) scale(0.46)"/>

    <!-- división de clase: escritorio + figura de saco entregando la libreta -->
    <rect x="60" y="1150" width="300" height="26"/>
    <rect x="86" y="1176" width="20" height="100"/>
    <rect x="320" y="1176" width="20" height="100"/>
    <path d="M150,1150 C150,1075 300,1075 300,1150 Z"/>
    <circle cx="225" cy="1058" r="40"/>
    <rect x="118" y="1124" width="150" height="26" fill="#cc2f26"/>

    <!-- gubias / vetas talladas en el suelo -->
    <g stroke="#ece5d6" stroke-width="7" fill="none" opacity="0.85">
      <path d="M20,1230 C260,1190 600,1175 990,1150"/>
      <path d="M20,1265 C300,1230 640,1212 990,1195"/>
    </g>
  </g>
</svg>
